name: BananaNative Android - build do proprio fork

"on":
  workflow_dispatch:
  push:
    branches:
      - android
    paths:
      - '.github/workflows/banana-android-apk.yml'
      - 'android/**'
      - 'dm/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    name: APK + preparador nativo (codigo-fonte)
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - name: Checkout do fork
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: .NET 10 (tradutor NativeAOT)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK r28c, SDK 36 e CMake 3.22.1
        shell: bash
        run: |
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Dependencias do compilador nativo
        shell: bash
        run: |
          command -v ninja >/dev/null || brew install ninja
          python3 -m venv "$RUNNER_TEMP/banana-cmake"
          "$RUNNER_TEMP/banana-cmake/bin/python" -m pip install 'cmake==3.31.6'
          echo "$RUNNER_TEMP/banana-cmake/bin" >> "$GITHUB_PATH"

      - name: Compilar preparador REAL do codigo-fonte
        id: native_stage
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/ondevice/build.sh \
            dm/gfx/tools/dmsh_xlate_android/build.sh \
            dm/gfx/tools/dmsh_xlate_android/build_spirv_tools.sh
          android/ondevice/build.sh "$RUNNER_TEMP/banana-build" all
          STAGE="$RUNNER_TEMP/banana-build/stage"
          test -s "$STAGE/lib/libpython3.14.so"
          test -s "$STAGE/lib/libnxpack.so"
          test -s "$STAGE/lib/libdmsh_xlate.so"
          test -s "$STAGE/lib/libSPIRV-Tools-shared.so"
          test -s "$STAGE/python/lib/python3.14/os.py"
          python3 dm/gfx/tools/xlate_tree.py > "$STAGE/translator-tree.txt"
          shasum -a 256 android/ondevice/dm_pack.c | awk '{print $1}' > "$STAGE/nxpack-source-sha256.txt"
          shasum -a 256 dm/gfx/tools/dmsh_xlate_android/build_spirv_tools.sh | awk '{print $1}' > "$STAGE/spv-tools-build-sha256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$STAGE/git-commit.txt"
          tar -czf "$RUNNER_TEMP/BananaNative-stage.tar.gz" -C "$RUNNER_TEMP/banana-build" stage
          shasum -a 256 "$RUNNER_TEMP/BananaNative-stage.tar.gz"
          mkdir -p output
          cp "$RUNNER_TEMP/BananaNative-stage.tar.gz" output/

      - name: Entregar preparador para compilar no Termux
        uses: actions/upload-artifact@v4
        with:
          name: BananaNative-stage-android-arm64
          path: output/BananaNative-stage.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Compilar APK com pasta e NUP
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/app/local.properties
          cd android/app
          chmod +x gradlew
          ./gradlew apk \
            -PnxPlay=true \
            -PnxGames=040074A01BF12000,0400C3F00006E000 \
            -PnxPackStage="$RUNNER_TEMP/banana-build/stage" \
            --no-daemon --max-workers=3 --stacktrace
          APK=out/nxnative-android-play.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/pack/python.zip'
          unzip -Z1 "$APK" | grep -Fx 'assets/pack/tools.zip'
          for lib in libnxpack.so libpython3.14.so libdmsh_xlate.so libSPIRV-Tools-shared.so; do
            unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/$lib"
          done
          for game in 040074A01BF12000 0400C3F00006E000; do
            unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libnxhost_$game.so"
          done
          shasum -a 256 "$APK"

      - name: Entregar APK compilada e assinada para testes
        uses: actions/upload-artifact@v4
        with:
          name: BananaNative-APK-NUP
          path: android/app/out/nxnative-android-play.apk
          if-no-files-found: error
          retention-days: 30
